<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="dl-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="dl-accent" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="40" height="40" rx="10" fill="url(#dl-grad)" />
  <!-- Analytical Lens Circle -->
  <circle cx="18" cy="18" r="9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Data Chart Bars inside Lens -->
  <rect x="13" y="19" width="2" height="5" rx="0.5" fill="#ffffff" opacity="0.9" />
  <rect x="17" y="15" width="2" height="9" rx="0.5" fill="#ffffff" />
  <rect x="21" y="12" width="2" height="12" rx="0.5" fill="url(#dl-accent)" />
  <!-- Focus Ray Handle -->
  <line x1="25" y1="25" x2="31" y2="31" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" />
</svg>
